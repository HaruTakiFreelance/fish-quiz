<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>シミラン諸島 生物図鑑</title>
<style>
:root{--bg:#06202e;--card:#0d3347;--ink:#e8f6fb;--sub:#8fc3d6;--acc:#3fd0c9;--seen:#ff7aa8}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(#06202e,#031018) fixed;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(6,32,46,.94);backdrop-filter:blur(8px);padding:12px 14px 8px;border-bottom:1px solid #12465f}
h1{margin:0 0 8px;font-size:18px;letter-spacing:.05em}
h1 small{font-weight:normal;color:var(--sub);font-size:12px;margin-left:6px}
.row{display:flex;gap:8px;align-items:center}
input[type=search]{flex:1;padding:9px 12px;border-radius:10px;border:1px solid #1c5d7a;background:#082a3a;color:var(--ink);font-size:15px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:6px 12px;border-radius:999px;border:1px solid #1c5d7a;background:transparent;color:var(--sub);font-size:13px;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--acc);color:#04202a;border-color:var(--acc);font-weight:600}
.btn{flex:none;padding:8px 10px;border-radius:10px;border:1px solid #1c5d7a;background:#082a3a;color:var(--sub);font-size:13px;cursor:pointer}
.btn.on{color:#04202a;background:var(--seen);border-color:var(--seen)}
.stat{color:var(--sub);font-size:12px;margin-top:6px}
.stat{display:flex;justify-content:space-between;align-items:center}
.copy{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--seen);background:transparent;color:var(--seen);cursor:pointer}
main{padding:12px;max-width:1200px;margin:0 auto}
h2{font-size:15px;color:var(--acc);margin:18px 4px 8px;border-left:3px solid var(--acc);padding-left:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.card{background:var(--card);border-radius:12px;overflow:hidden;position:relative;border:1px solid #12465f}
.card.seen{border-color:var(--seen)}
.ph{aspect-ratio:4/3;background:#082a3a;cursor:zoom-in;display:block;width:100%;object-fit:cover}
.info{padding:8px 10px 10px}
.jp{font-size:14px;font-weight:600;line-height:1.35}
.en{font-size:11px;color:var(--sub);margin-top:2px}
.tags{margin-top:5px;display:flex;gap:4px;flex-wrap:wrap}
.tg{font-size:10px;padding:1px 6px;border-radius:6px;background:#12465f;color:var(--sub)}
.tg.end{background:#5b2d6b;color:#f2d4ff}
.chk{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;border:2px solid rgba(255,255,255,.8);background:rgba(0,0,0,.35);color:#fff;font-size:15px;cursor:pointer}
.card.seen .chk{background:var(--seen);border-color:var(--seen);color:#04202a}
.fam{font-size:11px;color:#b9dbe8;margin-top:3px}.fam i{color:var(--sub)}
.jb{font-size:10px;padding:1px 6px;border-radius:6px}
.j0{background:#1f5a3a;color:#c9f5d9}.j1{background:#6b5a1f;color:#fbecb5}.j2{background:#6b2424;color:#ffd2d2}
.jtabs{display:flex;gap:6px;overflow-x:auto;padding-top:6px;scrollbar-width:none}
.jtab{flex:none;padding:4px 10px;border-radius:999px;border:1px solid #1c5d7a;background:transparent;color:var(--sub);font-size:12px;cursor:pointer}
.jtab.on{background:#e8f6fb;color:#04202a}
.empty{color:var(--sub);text-align:center;padding:40px}
/* ===== 詳細シート ===== */
#lb{position:fixed;inset:0;z-index:20;display:none}
#lb.on{display:block}
#lb .shade{position:absolute;inset:0;background:rgba(0,0,0,.6);animation:fade .2s}
#lb .sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:#0b2d3e;border-radius:18px 18px 0 0;animation:up .25s ease-out;padding-bottom:env(safe-area-inset-bottom)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.grab{width:40px;height:5px;border-radius:3px;background:#3b6b80;margin:8px auto 0}
.sh-top{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:#0b2d3e}
.ic{width:38px;height:38px;border-radius:50%;border:none;background:#12465f;color:var(--ink);font-size:18px;cursor:pointer}
.ic:disabled{opacity:.3}
.sh-img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#000;display:block}
.sh-body{padding:16px 18px 24px;text-align:left}
.sh-title{font-size:21px;font-weight:700;line-height:1.3}
.sh-en{font-size:13px;color:var(--sub);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;background:#12465f;color:#cfe9f3}
.chip i{opacity:.85}
.sec{margin-top:18px}
.sec h3{margin:0 0 6px;font-size:12px;color:var(--acc);letter-spacing:.08em;font-weight:600}
.sec p{margin:0;font-size:15px;line-height:1.75;color:#e3f2f8}
.jbox{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:#082a3a;border:1px solid #12465f}
.jbox .jb{flex:none;font-size:12px;padding:3px 8px;margin-top:2px}
.jbox p{font-size:14px;line-height:1.65}
.warn{margin-top:14px;font-size:12px;line-height:1.6;color:#fbecb5;background:#3a3112;border-radius:10px;padding:8px 10px}
.acts{display:flex;gap:10px;margin-top:22px}
.acts button,.acts a{flex:1;text-align:center;padding:12px;border-radius:12px;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer;border:1px solid #1c5d7a;background:#082a3a;color:var(--ink)}
.acts .on{background:var(--seen);border-color:var(--seen);color:#04202a}
.pos{font-size:12px;color:var(--sub)}
@media(min-width:760px){
 #lb .sheet{left:50%;top:50%;bottom:auto;right:auto;transform:translate(-50%,-50%);width:min(900px,92vw);max-height:86vh;border-radius:18px;animation:fade .2s;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;overflow:hidden}
 .grab{display:none}
 .sh-top{grid-column:1/3}
 .sh-img{height:100%;aspect-ratio:auto;max-height:calc(86vh - 50px)}
 .sh-body{overflow-y:auto;max-height:calc(86vh - 50px)}
}
.card{cursor:pointer}
footer{color:var(--sub);font-size:11px;text-align:center;padding:24px}
footer a{color:var(--sub)}
</style>
</head>
<body>
<header>
  <h1>シミラン諸島 生物図鑑<small id="total"></small></h1>
  <div class="row">
    <input type="search" id="q" placeholder="和名・英名・科名で検索（例：エイ / shark / ハタ科）">
    <button class="btn" id="seenOnly">♥ 見たい</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="jtabs" id="jtabs"></div>
  <div class="stat"><span id="stat"></span><button class="copy" id="copy" style="display:none">📋 見たいリストをコピー</button></div>
</header>
<main id="main"></main>
<div id="lb" role="dialog" aria-modal="true">
  <div class="shade"></div>
  <div class="sheet" id="sheet">
    <div class="sh-top" style="grid-column:1/3"><button class="ic" id="prev" aria-label="前へ">‹</button><span class="pos" id="pos"></span><span><button class="ic" id="next" aria-label="次へ">›</button> <button class="ic" id="close" aria-label="閉じる">✕</button></span></div>
    <img class="sh-img" id="lbimg" alt="">
    <div class="sh-body" id="lbbody"></div>
  </div>
</div>
<footer>「見たい」リストはこのブラウザ内にだけ保存されます。<br>説明文・科と属・日本での分布はClaudeが独自にまとめた目安です（「要確認」付きは種の特定や分布に自信がないもの）。<br>写真・掲載種の出典：<a href="https://hobo-ya-similan.com/similan/fish/" target="_blank" rel="noopener">ほうぼう屋 シミラン店「シミラン諸島の生物ガイド」</a><br>写真は元サイトから直接読み込んでいます。</footer>

];
// 英名（ファイル名から生成、綴りの崩れているものは補正）
const FIX={"blacktip-reef-sharke":"Blacktip Reef Shark","buffalofish":"Bumphead Parrotfish","scrawled-filefishz":"Scrawled Filefish","steinitzs-hrimp-goby":"Steinitz's Shrimp Goby","rock-mover-wasse":"Rockmover Wrasse","mccoskers-dwarf-wrrase":"McCosker's Flasher Wrasse","porcelain-anemone-rab":"Porcelain Anemone Crab","andaman-amsel":"Andaman Damsel","indian-vagabond-batterflyfish":"Indian Vagabond Butterflyfish","ornate-ghost-pipfish":"Ornate Ghost Pipefish","white-line-eawhip-goby":"Whip Coral Goby","etisussplendidus":"Etisus splendidus","coriocella-hibyae":"Coriocella hibyae","gymnodoris-alba":"Gymnodoris alba","jorunna-rubescens":"Jorunna rubescens","dermatobranchus-gonatophora":"Dermatobranchus gonatophora","cadlinella-ornatissima":"Cadlinella ornatissima","gymnodoris-rubropapillosa":"Gymnodoris rubropapillosa","halgerda-tessellata":"Halgerda tessellata","serpent-Pteraeolidia":"Pteraeolidia semperi","chromodoris-kuniei":"Chromodoris kuniei","halgerda-willey":"Halgerda willeyi","glossodoris-pallidas":"Glossodoris pallida","alcyonacea":"Soft Coral","cardisoma_carnifex":"Cardisoma carnifex","barringtonia_asiatica":"Barringtonia asiatica","hernandia_nymphaeifolia":"Hernandia nymphaeifolia","clarks-anemonefish":"Clark's Anemonefish","steinitzs":"","lubbocks-blenny":"Lubbock's Blenny","rollands-damsel":"Rolland's Damsel","tryons-risbecia":"Tryon's Risbecia","girdred-glossodoris":"Girdled Glossodoris","fleckled-anglerfish":"Freckled Frogfish","duskyfin-bulleye":"Duskyfin Bullseye","black-sweetlip":"Black Sweetlips","fire-fish":"Coral Scorpionfish","bat":"Fruit Bat","squirrel":"Squirrel","durban-hinge-beck-shrimp":"Durban Hinge-beak Shrimp","andaman-damsel":"Andaman Damsel"};
const en=f=>FIX[f]||f.split(/[-_]/).map(w=>w[0].toUpperCase()+w.slice(1)).join(" ");
const ENDEMIC=new Set(CATS.find(c=>c.id==="andaman").d.map(x=>x[1]));
const JL=["日本で見られる","日本ではまれ","日本では見られない"],JS=["🇯🇵 見られる","△ まれ","✕ 見られない"];
const all=[];CATS.forEach(c=>c.d.forEach(([jp,f])=>{const i=INFO[f]||["","",null,"",""];all.push({jp,f,en:en(f),cat:c.id,label:c.label,src:BASE+c.id+"/img/"+f+".webp",key:jp.replace(/（.*?）|\s/g,""),fam:i[0],gen:i[1],j:i[2],jt:i[3],desc:i[4],unsure:!!i[5]})}));
let jf="all";const jtabs=document.getElementById("jtabs");[["all","日本：すべて"],[0,JS[0]],[1,JS[1]],[2,JS[2]]].forEach(([v,l])=>{const b=document.createElement("button");b.className="jtab"+(v==="all"?" on":"");b.textContent=l;b.onclick=()=>{jf=v;[...jtabs.children].forEach(x=>x.classList.remove("on"));b.classList.add("on");render()};jtabs.appendChild(b)});
let seen={};try{seen=JSON.parse(localStorage.getItem("similanWant")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("similanWant",JSON.stringify(seen))}catch(e){}};
let cur="all",seenOnly=false;
const kana=s=>s.replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+96)).toLowerCase();
const tabs=document.getElementById("tabs");
[{id:"all",label:"すべて"},...CATS].forEach(c=>{const b=document.createElement("button");b.className="tab"+(c.id==="all"?" on":"");b.textContent=c.label+(c.d?` ${c.d.length}`:"");b.onclick=()=>{cur=c.id;[...tabs.children].forEach(x=>x.classList.remove("on"));b.classList.add("on");render();window.scrollTo(0,0)};tabs.appendChild(b)});
document.getElementById("q").oninput=render;
document.getElementById("seenOnly").onclick=e=>{seenOnly=!seenOnly;e.target.classList.toggle("on",seenOnly);render()};
function card(x){
 const d=document.createElement("div");d.className="card"+(seen[x.key]?" seen":"");
 const tags=(cur==="all"?`<span class="tg">${x.label.replace(/^\S+\s/,"")}</span>`:"")+(ENDEMIC.has(x.f)&&x.cat!=="andaman"?`<span class="tg end">固有種</span>`:"")+(x.cat==="andaman"&&cur==="all"?"":"");
 d.innerHTML=`<img class="ph" loading="lazy" src="${x.src}" alt="${x.jp}"><button class="chk" title="見たい">${seen[x.key]?"♥":"♡"}</button><div class="info"><div class="jp">${x.jp}</div><div class="en">${x.en}</div>${x.fam?`<div class="fam">${x.fam}${x.gen?` <i>${x.gen}</i>属`:""}</div>`:""}<div class="tags">${x.j!=null?`<span class="jb j${x.j}">${JS[x.j]}</span>`:""}${tags}</div></div>`;
 d.onclick=()=>openLb(x);
 d.querySelector(".chk").onclick=e=>{e.stopPropagation();if(seen[x.key])delete seen[x.key];else seen[x.key]=Date.now();save();render()};
 return d;
}
function render(){
 const q=kana(document.getElementById("q").value.trim());
 const main=document.getElementById("main");main.innerHTML="";
 const match=x=>(!q||kana(x.jp).includes(q)||x.en.toLowerCase().includes(q)||kana(x.fam).includes(q)||x.gen.toLowerCase().includes(q))&&(!seenOnly||seen[x.key])&&(jf==="all"||x.j===jf);
 let shown=0;LIST=[];
 const groups=cur==="all"?CATS:CATS.filter(c=>c.id===cur);
 const used=new Set();
 groups.forEach(c=>{
  const items=all.filter(x=>x.cat===c.id&&match(x)&&!(cur==="all"&&used.has(x.key)));
  items.forEach(x=>used.add(x.key));
  if(!items.length)return;
  if(cur==="all"){const h=document.createElement("h2");h.textContent=`${c.label}（${items.length}）`;main.appendChild(h)}
  const g=document.createElement("div");g.className="grid";items.forEach(x=>{LIST.push(x);g.appendChild(card(x))});main.appendChild(g);shown+=items.length;
 });
 if(!shown)main.innerHTML='<div class="empty">該当する生物がいません</div>';
 const uniq=new Set(all.map(x=>x.key)).size,n=Object.keys(seen).filter(k=>all.some(x=>x.key===k)).length;
 document.getElementById("total").textContent=`${uniq}種`;
 document.getElementById("stat").textContent=`表示 ${shown}件 ・ 見たい ♥ ${n}種`;document.getElementById("copy").style.display=n?"":"none";
}
document.getElementById("copy").onclick=async e=>{
 const lines=["【シミランで見たい生物】"],used=new Set();CATS.forEach(c=>{const xs=all.filter(x=>x.cat===c.id&&seen[x.key]&&!used.has(x.key));xs.forEach(x=>used.add(x.key));if(xs.length){lines.push("",c.label.replace(/^\S+\s/,""));xs.forEach(x=>lines.push("・"+x.jp))}});
 const t=lines.join("\n");try{await navigator.clipboard.writeText(t);e.target.textContent="✓ コピーしました"}catch(err){e.target.textContent="コピーできませんでした"}setTimeout(()=>e.target.textContent="📋 見たいリストをコピー",2000)};
let LIST=[],idx=-1;
const lb=document.getElementById("lb"),sheet=document.getElementById("sheet");
function openLb(x){idx=LIST.indexOf(x);if(idx<0){LIST=[x];idx=0}show();lb.classList.add("on");document.body.style.overflow="hidden"}
function closeLb(){lb.classList.remove("on");document.body.style.overflow=""}
function show(){
 const x=LIST[idx];
 document.getElementById("lbimg").src=x.src;document.getElementById("lbimg").alt=x.jp;
 document.getElementById("pos").textContent=`${idx+1} / ${LIST.length}`;
 document.getElementById("prev").disabled=idx<=0;document.getElementById("next").disabled=idx>=LIST.length-1;
 const s=!!seen[x.key];
 document.getElementById("lbbody").innerHTML=`
  <div class="sh-title">${x.jp}</div><div class="sh-en">${x.en}</div>
  <div class="chips">${x.fam?`<span class="chip">${x.fam}</span>`:""}${x.gen?`<span class="chip"><i>${x.gen}</i> 属</span>`:""}<span class="chip">${x.label}</span>${ENDEMIC.has(x.f)?`<span class="chip" style="background:#5b2d6b;color:#f2d4ff">アンダマン海の固有種</span>`:""}</div>
  ${x.desc?`<div class="sec"><h3>特徴</h3><p>${x.desc}</p></div>`:""}
  <div class="sec"><h3>日本では</h3><div class="jbox"><span class="jb j${x.j}">${JS[x.j]}</span><p>${x.jt}</p></div></div>
  ${x.unsure?`<div class="warn">⚠️ 種の特定や日本での分布に不確かな点があります（要確認）</div>`:""}
  <div class="acts"><button id="seenBtn" class="${s?"on":""}">${s?"♥ 見たいリスト入り":"♡ 見たいに追加"}</button><a href="${BASE+x.cat+"/"}" target="_blank" rel="noopener">元サイトの解説 ↗</a></div>`;
 document.getElementById("seenBtn").onclick=()=>{if(seen[x.key])delete seen[x.key];else seen[x.key]=Date.now();save();render();idx=Math.max(0,LIST.findIndex(y=>y.key===x.key));if(LIST[idx]&&LIST[idx].key===x.key)show();else closeLb()};
 sheet.scrollTop=0;document.getElementById("lbbody").scrollTop=0;
}
const go=d=>{const n=idx+d;if(n>=0&&n<LIST.length){idx=n;show()}};
document.getElementById("prev").onclick=()=>go(-1);document.getElementById("next").onclick=()=>go(1);
document.getElementById("close").onclick=closeLb;lb.querySelector(".shade").onclick=closeLb;
document.addEventListener("keydown",e=>{if(!lb.classList.contains("on"))return;if(e.key==="Escape")closeLb();if(e.key==="ArrowLeft")go(-1);if(e.key==="ArrowRight")go(1)});
let tx=0,ty=0;const im=document.getElementById("lbimg");
im.addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
im.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))go(dx<0?1:-1)},{passive:true});
render();
</script>
</body>
</html>
